<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ZYFRED.OS — Zyfred Lorenz Paclibar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Archivo+Black&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#7EAA9E;--accent2:#28324C;--bg:#05070d;--panel:rgba(13,18,29,.82);
  --line:rgba(255,255,255,.10);--txt:#e8eefb;--muted:#8a99b4;--r:16px;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --display:'Archivo Black',system-ui,sans-serif;
  --tech:'Orbitron', sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
body.reduce-motion *{animation-duration:.001s!important;transition-duration:.001s!important}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 50% 40%,transparent 32%,rgba(0,0,0,.78) 100%)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.22;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}

#boot{position:fixed;inset:0;z-index:500;background:#04060b;display:flex;align-items:center;
  justify-content:center;padding:24px;transition:opacity .5s ease,visibility .5s}
#boot.done{opacity:0;visibility:hidden}
.boot-inner{width:min(560px,100%);font-family:var(--mono);font-size:13px}
.boot-logo{font-family:var(--display);font-size:26px;letter-spacing:.34em;margin-bottom:18px;color:#fff}
.boot-logo span{color:var(--accent)}
#boot-log{min-height:170px;line-height:1.9;color:#9fb0c9}
#boot-log .ok{color:var(--accent)}
#boot-log .warn{color:#ffb020}
.boot-bar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin:18px 0}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}
#boot-enter{display:none;margin-top:8px}
.boot-hint{margin-top:14px;font-size:11px;color:#5b6a83}

#topbar{position:fixed;top:0;left:0;right:0;height:46px;z-index:60;display:flex;align-items:center;
  gap:10px;padding:0 14px;background:rgba(6,9,16,.62);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;font-size:13px;
  padding:6px 8px;border-radius:8px;transition:.15s}
.brand:hover{background:rgba(255,255,255,.06)}
.brand .dotmark{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent);display:inline-block}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);white-space:nowrap}
.spacer{flex:1}
.tb-btn{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  transition:.15s;white-space:nowrap}
.tb-btn:hover{color:var(--txt);border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.tb-btn.off{opacity:.5}
#clock{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:56px;text-align:right}

#dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;
  gap:5px;padding:8px;border-radius:18px;background:rgba(10,14,22,.72);backdrop-filter:blur(18px);
  border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.65)}
.dock-btn{position:relative;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-size:19px;color:var(--muted);transition:transform .15s,background .15s,color .15s}
.dock-btn:hover{transform:translateY(-6px) scale(1.06);
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:#fff}
.dock-btn:active{transform:translateY(-2px) scale(.98)}
.dock-btn.running::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dock-btn .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);
  font-size:11px;white-space:nowrap;padding:4px 8px;border-radius:6px;background:#0b1120;
  border:1px solid var(--line);opacity:0;pointer-events:none;transition:.15s;color:var(--txt);z-index:5}
.dock-btn:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}

#desk{position:fixed;inset:0;z-index:10;pointer-events:none}
.window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  background:var(--panel);backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:260px;
  box-shadow:0 30px 90px rgba(0,0,0,.68),inset 0 1px 0 rgba(255,255,255,.06);
  animation:winIn .24s cubic-bezier(.2,.9,.3,1.2)}
@keyframes winIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.window.closing{animation:winOut .17s ease forwards}
@keyframes winOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
.window.minimized{display:none}
.window.maximized{left:8px!important;top:54px!important;width:calc(100vw - 16px)!important;
  height:calc(100vh - 132px)!important}
.window.focused{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  box-shadow:0 30px 90px rgba(0,0,0,.68),0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),
  inset 0 1px 0 rgba(255,255,255,.07)}
.win-head{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:grab;user-select:none;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.win-head:active{cursor:grabbing}
.win-icon{color:var(--accent);font-size:13px;width:18px;text-align:center}
.win-title{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-ctl{display:flex;gap:6px}
.win-ctl button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-size:12px;line-height:1;color:var(--muted);border:1px solid transparent;transition:.15s}
.win-ctl button:hover{background:rgba(255,255,255,.1);color:#fff}
.win-ctl .close:hover{background:#ff3d5e;color:#fff}
.win-ctl .max:hover{background:#2ecc71;color:#04120a}
.win-ctl .min:hover{background:#f5c542;color:#1a1400}
.win-body{padding:20px;overflow:auto;flex:1;overscroll-behavior:contain}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;
  padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:500;
  color:var(--txt);background:rgba(255,255,255,.04);transition:.16s}
.btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
  transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;color:#04070d;font-weight:700}
.btn.primary:hover{filter:brightness(1.1);
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.ghost{background:transparent}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted)}
.lead{font-size:14px;line-height:1.75;color:#c3cee0}
h2.sect{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  margin:22px 0 12px;font-weight:500}
h2.sect:first-child{margin-top:0}

.hero{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.avatar{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-weight:700;
  font-size:22px;color:#04070d;background:linear-gradient(135deg,var(--accent),var(--accent2));
  flex:none;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 30%,transparent)}
.h-name{font-size:21px;letter-spacing:-.01em}
.h-role{font-size:13px;color:var(--accent);margin-top:3px}
.h-loc{font-size:12px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;
  background:rgba(255,255,255,.03);text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent)}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.skill{margin-bottom:15px}
.skill-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.skill-top span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width 1s cubic-bezier(.2,.9,.3,1)}

.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.proj-card{text-align:left;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:rgba(255,255,255,.03);transition:.2s}
.proj-card:hover{transform:translateY(-4px);border-color:var(--accent);
  box-shadow:0 16px 40px rgba(0,0,0,.5)}
.proj-art{height:96px;position:relative}
.proj-art::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.32),transparent)}
.proj-meta{padding:12px}
.proj-meta h4{font-size:13px;margin-bottom:3px;letter-spacing:.04em}
.proj-meta p{font-size:11px;color:var(--muted)}
.proj-hero{height:130px;border-radius:14px;border:1px solid var(--line);position:relative;overflow:hidden}
.proj-hero .ph-tag{position:absolute;bottom:10px;left:12px;font-family:var(--mono);font-size:11px;
  color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9)}

/* === NEW PRINT MEDIA POSTER STYLES === */
.tech-poster-mockup {
  width: 100%; border-radius: 12px; overflow: hidden; position: relative;
  background: #020612;
  border: 1px solid rgba(0, 255, 255, 0.2);
  box-shadow: 0 10px 40px rgba(0, 255, 255, 0.1), inset 0 0 60px rgba(0, 255, 255, 0.05);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center; font-family: var(--sans);
}
/* Circuit board background effect */
.tech-poster-mockup::before {
  content: ''; position: absolute; inset: 0;
  background-image: 
    linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
  background-size: 20px 20px; opacity: 0.5; z-index: 0;
}
/* Glowing rings behind the text */
.tech-poster-mockup::after {
  content: ''; position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
  width: 300px; height: 300px; border-radius: 50%;
  border: 2px solid rgba(0, 255, 255, 0.2);
  box-shadow: 0 0 30px rgba(0, 255, 255, 0.1), inset 0 0 30px rgba(0, 255, 255, 0.1);
  z-index: 0; pointer-events: none;
}
.tp-content { position: relative; z-index: 2; width: 100%; max-width: 500px; }
.tp-title {
  font-family: var(--tech); font-size: 38px; font-weight: 900; color: #00ffff;
  text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;
  text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
  line-height: 1.1;
}
.tp-desc {
  font-size: 14px; color: #ffffff; line-height: 1.6; margin-bottom: 24px;
  font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.tp-date {
  font-family: var(--tech); font-size: 16px; color: #00ffff; font-weight: 700;
  letter-spacing: 1px; margin-bottom: 30px;
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
}
.tp-btn {
  display: inline-block; padding: 14px 40px; border-radius: 8px;
  background: #ff00a0; color: #fff; font-family: var(--sans); font-weight: 700;
  font-size: 18px; letter-spacing: 1px; text-transform: uppercase;
  box-shadow: 0 0 20px rgba(255, 0, 160, 0.6), inset 0 0 10px rgba(255,255,255,0.3);
  border: 1px solid #ff4dc3; cursor: pointer; transition: all 0.2s;
}
.tp-btn:hover {
  transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 160, 0.9);
}
.tp-footer {
  font-size: 11px; color: #6b7a99; margin-top: 40px; letter-spacing: 1px;
}
/* ===================================== */

.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gal-tile{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);position:relative;
  overflow:hidden;transition:.2s;display:grid;place-items:end start;padding:10px;width:100%}
.gal-tile span{font-size:10px;font-family:var(--mono);color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.9);position:relative;z-index:2}
.gal-tile::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.6))}
.gal-tile:hover{transform:scale(1.04);border-color:var(--accent)}

.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.pal-sw{width:52px;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
  cursor:pointer;transition:.15s}
.pal-sw:hover{transform:scale(1.08);border-color:#fff}

.term{font-family:var(--mono);font-size:12.5px;line-height:1.7;background:#060a12;
  border-radius:12px;border:1px solid var(--line);padding:14px;height:100%;
  display:flex;flex-direction:column;min-height:260px}
.term-out{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term-line{color:#9fb0c9;margin-bottom:2px}
.term-line .cmd{color:var(--accent)}
.term-line.err{color:#ff6b81}
.term-line.ok{color:#5ef2a0}
.term-line b{color:#fff}
.term-in{display:flex;gap:8px;align-items:center;margin-top:10px;
  border-top:1px solid var(--line);padding-top:10px}
.term-in .prompt{color:var(--accent);font-size:12px;white-space:nowrap}
.term-in input{flex:1;background:none;border:0;outline:none;color:var(--txt);
  font-family:var(--mono);font-size:13px}

.viz{width:100%;height:110px;border-radius:12px;border:1px solid var(--line);
  background:#060a12;display:block}
.track-name{font-size:18px;letter-spacing:.02em}
.track-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.player-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;transition:.15s;color:var(--txt)}
.icon-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.icon-btn.play{background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#04070d;border-color:transparent}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;
  background:rgba(255,255,255,.12);flex:1;min-width:90px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 10px var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;
  background:var(--accent);cursor:pointer}

.play-canvas{width:100%;height:230px;border-radius:12px;border:1px solid var(--line);
  background:#060a12;display:block;cursor:crosshair;touch-action:none}

.field{margin-bottom:12px}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;
  outline:none;transition:.15s;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.copy-row{display:flex;align-items:center;gap:10px;padding:11px 13px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:10px}
.copy-row code{font-family:var(--mono);font-size:12.5px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.socials{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:6px}
.social{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);font-size:12.5px;color:var(--muted);transition:.15s}
.social:hover{border-color:var(--accent);color:#fff;
  background:color-mix(in srgb,var(--accent) 12%,transparent);transform:translateY(-2px)}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;transition:.15s}
.sw:hover{transform:scale(1.12)}
.sw.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;font-size:13px}
.switch small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tgl{width:44px;height:24px;border-radius:99px;background:rgba(255,255,255,.13);
  position:relative;transition:.2s;flex:none}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;transition:.2s}
.tgl.on{background:var(--accent)}
.tgl.on::after{left:23px}
.wall-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wall-opt{padding:10px 6px;border-radius:10px;border:1px solid var(--line);font-size:11px;
  color:var(--muted);transition:.15s;text-align:center}
.wall-opt:hover{border-color:var(--accent);color:#fff}
.wall-opt.active{border-color:var(--accent);color:#fff;
  background:color-mix(in srgb,var(--accent) 14%,transparent)}

.kbd{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff}
.help-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px}
.help-row:last-child{border-bottom:0}

.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;
  justify-content:center;padding:12vh 16px 16px;background:rgba(2,4,8,.62);
  backdrop-filter:blur(6px)}
.overlay.hidden{display:none}
.palette{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.75);
  animation:winIn .18s ease}
.palette input{width:100%;background:none;border:0;outline:none;padding:16px 18px;
  font-size:15px;border-bottom:1px solid var(--line)}
.palette-list{max-height:320px;overflow:auto;padding:8px}
.palette-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;
  border-radius:10px;font-size:14px;text-align:left;color:var(--muted);transition:.1s}
.palette-item .ic{width:18px;text-align:center;color:var(--accent)}
.palette-item:hover,.palette-item.sel{background:color-mix(in srgb,var(--accent) 15%,transparent);color:#fff}
.palette-item .k{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.5}
.lightbox{width:min(620px,100%);margin-top:6vh;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:winIn .2s ease;
  box-shadow:0 30px 90px rgba(0,0,0,.75)}
.lightbox .art{height:250px;position:relative;display:flex}
.lightbox .cap{padding:16px 18px;display:flex;align-items:center;gap:12px}
#toasts{position:fixed;bottom:84px;right:18px;z-index:300;display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:10px;
  background:rgba(12,18,30,.96);border:1px solid var(--line);border-left:2px solid var(--accent);
  font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.55);animation:toastIn .25s ease;
  max-width:min(340px,80vw)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

@media(max-width:640px){
  .window{left:8px!important;top:54px!important;width:calc(100vw - 16px)!important;
    height:calc(100vh - 130px)!important}
  .window.maximized{height:calc(100vh - 130px)!important}
  #dock{gap:2px;padding:5px;bottom:8px;max-width:calc(100vw - 12px)}
  .dock-btn{width:36px;height:36px;font-size:15px;border-radius:9px}
  .win-body{padding:15px}
  #clock{display:none}
  .badge{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .wall-grid{grid-template-columns:repeat(2,1fr)}
}

<script>
/* ============ UTILS ============ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ AUDIO ============ */
let actx = null;
function getCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const Sfx = {
  enabled: true,
  blip(freq = 660, dur = 0.06, type = 'square', vol = 0.03) {
    if (!this.enabled) return;
    try {
      const c = getCtx(), o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g).connect(c.destination);
      o.start(); o.stop(c.currentTime + dur + 0.02);
    } catch (e) {}
  }
};

/* ============ PREFS ============ */
const DEFAULTS = { accent: '#7EAA9E', accent2: '#28324C', wall: 'grid', sound: true, motion: true };
let prefs = { ...DEFAULTS };
try { Object.assign(prefs, JSON.parse(localStorage.getItem('zyfred.os') || '{}')); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem('zyfred.os', JSON.stringify(prefs)); } catch (e) {} };

const ACCENTS = [
  { a: '#7EAA9E', b: '#28324C' },  /* mood board */
  { a: '#22e6ff', b: '#ff3d9a' },
  { a: '#5ef2a0', b: '#22e6ff' },
  { a: '#ffb020', b: '#ff3d5e' },
  { a: '#a97bff', b: '#22e6ff' },
  { a: '#f5feff', b: '#453939' }
];

const getAccent  = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
const getAccent2 = () => getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim();

function applyTheme() {
  document.documentElement.style.setProperty('--accent', prefs.accent);
  document.documentElement.style.setProperty('--accent2', prefs.accent2);
  Sfx.enabled = prefs.sound;
  document.body.classList.toggle('reduce-motion', !prefs.motion);
  bg.setMode(prefs.wall);
  bg.refreshColors();
  const sb = $('#btn-sound');
  if (sb) { sb.textContent = prefs.sound ? '♪ on' : '♪ off'; sb.classList.toggle('off', !prefs.sound); }
  savePrefs();
}

/* ============ TOAST / COPY ============ */
function toast(msg, icon = '✓') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span style="color:var(--accent)">${icon}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 2500);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied: ' + text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied: ' + text); }
    catch (_) { toast('Copy failed — select manually', '!'); }
    ta.remove();
  }
}

/* ============ BACKGROUND ============ */
const bg = (() => {
  const canvas = $('#bg'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, mode = 'grid', t0 = performance.now(), raf = null;
  let stars = [];
  let rgb = [126, 170, 158], rgb2 = [40, 50, 76];

  function hexToRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: 110 }, () => ({
      x: rand(0, W), y: rand(0, H), z: rand(0.25, 1), s: rand(0.5, 1.8)
    }));
  }
  function drawGrid(time) {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.35, Math.max(W, H) * 0.85);
    g.addColorStop(0, 'rgba(30,42,52,.7)');
    g.addColorStop(1, 'rgba(5,7,13,1)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const step = 54;
    for (let x = step / 2; x < W + step; x += step) {
      for (let y = step / 2; y < H + step; y += step) {
        const d = Math.hypot(x - W / 2, y - H / 2);
        const wave = Math.sin(d * 0.011 - time * 0.0016) * 0.5 + 0.5;
        const a = wave * 0.42 + 0.05;
        ctx.beginPath();
        ctx.arc(x, y, 1 + wave * 1.5, 0, 6.2832);
        ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
        ctx.fill();
      }
    }
  }
  function drawAurora(time) {
    ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 4; i++) {
      const px = W * (0.5 + 0.42 * Math.sin(time * 0.00016 + i * 1.7));
      const py = H * (0.5 + 0.32 * Math.cos(time * 0.00021 + i * 2.1));
      const r = Math.max(W, H) * 0.42;
      const g = ctx.createRadialGradient(px, py, 0, px, py, r);
      const c = i % 2 ? rgb2 : rgb;
      g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},.20)`);
      g.addColorStop(1, 'rgba(5,7,13,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  function drawStars(time) {
    ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      s.y += s.z * 0.22;
      if (s.y > H) { s.y = -4; s.x = rand(0, W); }
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.001 + s.x));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s * s.z, 0, 6.2832);
      ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(0.25 + s.z * 0.55) * tw})`;
      ctx.fill();
    }
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const time = now - t0;
    if (mode === 'grid') drawGrid(time);
    else if (mode === 'aurora') drawAurora(time);
    else if (mode === 'stars') drawStars(time);
    else { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); }
  }
  window.addEventListener('resize', resize);
  resize();
  raf = requestAnimationFrame(frame);
  return {
    setMode(m) {
      mode = m || 'grid';
      if (!prefs.motion) {
        cancelAnimationFrame(raf); raf = null;
        if (mode === 'grid') drawGrid(0);
        else if (mode === 'aurora') drawAurora(0);
        else if (mode === 'stars') drawStars(0);
        else { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); }
      } else if (!raf) {
        raf = requestAnimationFrame(frame);
      }
    },
    refreshColors() {
      rgb = hexToRgb(getAccent() || '#7EAA9E');
      rgb2 = hexToRgb(getAccent2() || '#28324C');
    }
  };
})();

/* ============ DATA ============ */

const SKILLS = [

  { n: 'Excel / Google Sheets',          v: 90 },

];
const TOOLS = ['Figma', 'VS Code', 'Tableau', 'Power BI', 'SQL', 'Python', 'Git', 'Notion'];

/* ============ WINDOW MANAGER ============ */
const WINS = {};
let zTop = 20;

function updateDock() {
  $$('.dock-btn').forEach(b => b.classList.toggle('running', !!WINS[b.dataset.app]));
}
function focusWin(id) {
  const w = WINS[id]; if (!w) return;
  w.root.style.zIndex = ++zTop;
  Object.entries(WINS).forEach(([k, x]) => x.root.classList.toggle('focused', k === id));
}
function openApp(id) {
  const app = APPS[id];
  if (!app) { toast('Unknown app: ' + id, '!'); return; }
  Sfx.blip(680, 0.05, 'triangle', 0.025);
  if (WINS[id]) {
    const w = WINS[id];
    if (w.minimized) { w.minimized = false; w.root.classList.remove('minimized'); }
    focusWin(id); updateDock();
    return;
  }
  createWindow(id, app);
}
function createWindow(id, app) {
  const [w0, h0] = app.size || [560, null];
  const root = document.createElement('div');
  root.className = 'window focused';
  root.style.width = `min(${w0}px, calc(100vw - 24px))`;
  if (h0) root.style.height = `min(${h0}px, calc(100vh - 150px))`;

  const vw = window.innerWidth, vh = window.innerHeight;
  const estW = Math.min(w0, vw - 24);
  const estH = h0 ? Math.min(h0, vh - 150) : 420;
  const count = Object.keys(WINS).length;
  const off = (count % 5) * 26;
  const left = clamp(vw / 2 - estW / 2 + off - 52, 12, Math.max(12, vw - estW - 12));
  const top  = clamp(vh / 2 - estH / 2 + off * 0.8 - 40, 54, Math.max(54, vh - estH - 100));
  root.style.left = left + 'px';
  root.style.top = top + 'px';
  root.style.zIndex = ++zTop;

  root.innerHTML = `
    <div class="win-head">
      <span class="win-icon">${app.icon || '▣'}</span>
      <span class="win-title">${esc(app.title)}</span>
      <div class="win-ctl">
        <button class="min" title="Minimize">–</button>
        <button class="max" title="Maximize">□</button>
        <button class="close" title="Close">✕</button>
      </div>
    </div>
    <div class="win-body"></div>`;

  const body = $('.win-body', root);
  body.innerHTML = typeof app.render === 'function' ? app.render() : '';
  $('#desk').appendChild(root);

  const rec = { root, body, minimized: false, maximized: false };
  WINS[id] = rec;
  updateDock();

  $('.close', root).addEventListener('click', e => { e.stopPropagation(); closeApp(id); });
  $('.min',   root).addEventListener('click', e => { e.stopPropagation(); minimizeApp(id); });
  $('.max',   root).addEventListener('click', e => { e.stopPropagation(); toggleMax(id); });

  const head = $('.win-head', root);
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-ctl')) return;
    focusWin(id);
    if (root.classList.contains('maximized')) return;
    const r = root.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    head.setPointerCapture(e.pointerId);
    const move = ev => {
      root.style.left = clamp(ev.clientX - ox, -60, window.innerWidth - 100) + 'px';
      root.style.top  = clamp(ev.clientY - oy, 46, window.innerHeight - 60) + 'px';
    };
    const up = () => {
      head.releasePointerCapture(e.pointerId);
      head.removeEventListener('pointermove', move);
      head.removeEventListener('pointerup', up);
      head.removeEventListener('pointercancel', up);
    };
    head.addEventListener('pointermove', move);
    head.addEventListener('pointerup', up);
    head.addEventListener('pointercancel', up);
  });

  root.addEventListener('pointerdown', () => focusWin(id), true);

  if (typeof app.init === 'function') {
    try { app.init(body, id); } catch (err) { console.warn(err); }
  }
  focusWin(id);
}
function closeApp(id) {
  const w = WINS[id]; if (!w) return;
  Sfx.blip(420, 0.05, 'sine', 0.025);
  w.root.classList.add('closing');
  setTimeout(() => {
    w.root.remove();
    delete WINS[id];
    updateDock();
  }, 170);
}
function minimizeApp(id) {
  const w = WINS[id]; if (!w) return;
  w.minimized = true;
  w.root.classList.add('minimized');
  updateDock();
}
function toggleMax(id) {
  const w = WINS[id]; if (!w) return;
  w.maximized = !w.maximized;
  w.root.classList.toggle('maximized', w.maximized);
  focusWin(id);
}

  terminal: {
    title: 'Terminal', icon: '▸', size: [620, 420],
    render() {

  music: {
    title: 'Synthesizer', icon: '♫', size: [480, null],
    render() {
      return `
        <div class="track-name">Ambient Loop 01</div>
        <div class="track-sub">generative · pentatonic scale</div>
        <canvas class="viz" id="viz" style="margin-top:14px"></canvas>
        <div class="player-row">
          <button class="icon-btn play" id="play">▶</button>
          <input type="range" id="vol" min="0" max="100" value="35">
          <span style="font-family:var(--mono);font-size:11px;color:var(--muted)" id="vol-lbl">35%</span>
        </div>
        <div class="btn-row">
          <button class="btn" id="chill">chill mode</button>
          <button class="btn" id="bright">bright mode</button>
        </div>`;
    },
    init(body) {
      const canvas = $('#viz', body);
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0;
      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.clientWidth; H = canvas.clientHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      resize(); window.addEventListener('resize', resize);

      const state = { playing: false, timer: null, step: 0, volume: 0.35, mode: 'chill' };
      const scales = {
        chill:  [196.00, 220.00, 261.63, 293.66, 329.63, 392.00],
        bright: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]
      };
      const pattern = [0, 2, 4, 2, 1, 3, 5, 3];

      function note(freq, dur = 0.9) {
        if (state.volume <= 0) return;
        try {
          const c = getCtx(), o = c.createOscillator(), g = c.createGain();
          o.type = state.mode === 'chill' ? 'sine' : 'triangle';
          o.frequency.value = freq;
          const v = 0.18 * state.volume;
          g.gain.setValueAtTime(0.0001, c.currentTime);
          g.gain.exponentialRampToValueAtTime(v, c.currentTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
          o.connect(g).connect(c.destination);
          o.start(); o.stop(c.currentTime + dur + 0.05);
        } catch (e) {}
      }
      function tick() {
        const sc = scales[state.mode];
        const idx = pattern[state.step % pattern.length];
        note(sc[idx]);
        state.step++;
      }
      function draw() {
        if (!W) { requestAnimationFrame(draw); return; }
        requestAnimationFrame(draw);
        ctx.clearRect(0, 0, W, H);
        const bars = 40;
        const t = performance.now() * 0.002;
        for (let i = 0; i < bars; i++) {
          const phase = state.playing ? Math.sin(t + i * 0.4) * 0.5 + 0.5 : 0.05;
          const bh = phase * H * 0.75;
          const x = (i / bars) * W;
          const bw = W / bars - 3;
          const acc = getAccent();
          ctx.fillStyle = i % 2 ? acc : getAccent2();
          ctx.globalAlpha = state.playing ? 0.85 : 0.25;
          ctx.fillRect(x, H - bh - 6, bw, bh);
        }
        ctx.globalAlpha = 1;
      }
      draw();

      const playBtn = $('#play', body);
      const vol = $('#vol', body);
      const volLbl = $('#vol-lbl', body);

      playBtn.addEventListener('click', () => {
        state.playing = !state.playing;
        playBtn.textContent = state.playing ? '❚❚' : '▶';
        if (state.playing) {
          getCtx();
          tick();
          state.timer = setInterval(tick, 420);
          toast('Playback started', '♪');
        } else {
          clearInterval(state.timer);
          toast('Paused', '❚❚');
        }
      });
      vol.addEventListener('input', () => {
        state.volume = +vol.value / 100;
        volLbl.textContent = vol.value + '%';
      });
      $('#chill', body).addEventListener('click', () => {
        state.mode = 'chill'; toast('Chill mode', '♪');
      });
      $('#bright', body).addEventListener('click', () => {
        state.mode = 'bright'; toast('Bright mode', '♪');
      });
    }
  },

          <button class="btn ghost" id="clear">Clear</button>
          <button class="btn" id="save">Save PNG</button>
        </div>`;
    },
    init(body) {
      const canvas = $('#pad', body);
      const ctx = canvas.getContext('2d');
      let drawing = false, color = '#7EAA9E', size = 4;
      let last = null;
      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = canvas.clientWidth, h = canvas.clientHeight;
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        try { ctx.putImageData(img, 0, 0); } catch (e) {}
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      };
      resize(); window.addEventListener('resize', resize);

      const pos = e => {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };
      canvas.addEventListener('pointerdown', e => {
        drawing = true;
        last = pos(e);
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', e => {
        if (!drawing) return;
        const p = pos(e);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        last = p;
      });
      const stop = () => { drawing = false; };
      canvas.addEventListener('pointerup', stop);
      canvas.addEventListener('pointercancel', stop);
      canvas.addEventListener('pointerleave', stop);

      $$('[data-color]', body).forEach(b => {
        b.addEventListener('click', () => {
          color = b.dataset.color;
          $$('[data-color]', body).forEach(x => x.style.borderColor = 'transparent');

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        toast('Canvas cleared', '✕');
      });
      $('#save', body).addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');

        a.click();
        toast('Saved as PNG');

    }

    })),

function renderPaletteList() {
  const q = paletteInput.value.toLowerCase().trim();
  paletteList.innerHTML = paletteItems
    .map((it, i) => ({ ...it, i }))
    .filter(it => !q || it.label.toLowerCase().includes(q))
    .map(it => `

paletteInput.addEventListener('input', () => { paletteSel = 0; renderPaletteList(); });
paletteInput.addEventListener('keydown', e => {
  const visible = $$('.palette-item', paletteList);
  if (e.key === 'ArrowDown') { paletteSel = Math.min(paletteSel + 1, visible.length - 1); renderPaletteList(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { paletteSel = Math.max(paletteSel - 1, 0); renderPaletteList(); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const item = paletteItems[paletteSel];
    if (item) { paletteEl.classList.add('hidden'); item.action(); }
  } else if (e.key === 'Escape') {
    paletteEl.classList.add('hidden');
  }
});
paletteEl.addEventListener('click', e => {
  if (e.target === paletteEl) paletteEl.classList.add('hidden');
});

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click', e => {
  const openBtn = e.target.closest('[data-open]');
  if (openBtn) { openApp(openBtn.dataset.open); return; }
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn) { closeApp(closeBtn.dataset.close); return; }
  if (e.target.closest('[data-palette]')) { openPalette(); return; }
});

/* ============ TOPBAR ============ */
$('#btn-sound').addEventListener('click', () => {
  prefs.sound = !prefs.sound;
  applyTheme();
  toast('Sound ' + (prefs.sound ? 'on' : 'off'));
});
$('#btn-help').addEventListener('click', () => openApp('help'));

/* ============ CLOCK ============ */
function tickClock() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  $('#clock').textContent = hh + ':' + mm;
}
tickClock();
setInterval(tickClock, 15000);

/* ============ KEYBOARD ============ */
document.addEventListener('keydown', e => {
  const inInput = e.target.matches('input, textarea');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); openPalette(); return;
  }
  if (e.key === 'Escape') {
    if (!paletteEl.classList.contains('hidden')) { paletteEl.classList.add('hidden'); return; }
    if (!$('#lightbox').classList.contains('hidden')) { $('#lightbox').classList.add('hidden'); return; }
    const focused = Object.entries(WINS).find(([k, w]) => w.root.classList.contains('focused'));
    if (focused) closeApp(focused[0]);
    return;
  }
  if (inInput) return;
  const map = { '1': 'about', '2': 'skills', '3': 'projects', '4': 'terminal', '5': 'gallery', '6': 'music', '7': 'playground', '8': 'contact' };
  if (map[e.key]) { openApp(map[e.key]); }
  if (e.key.toLowerCase() === 'm') { prefs.sound = !prefs.sound; applyTheme(); toast('Sound ' + (prefs.sound ? 'on' : 'off')); }
});

/* ============ BOOT ============ */
const bootLines = [
  ['zyfred.os kernel v2.6', 'ok'],
  ['mounting /dev/curiosity', 'ok'],
  ['loading analysis modules', 'ok'],
  ['palette · #453939 #FFFFFF #F5FEFF #28324C #7EAA9E', 'ok'],
  ['loading print media · TECH WEEK 2026', 'ok'],
  ['starting window manager', 'warn'],
  ['rendering desktop ...', 'ok']
];

async function bootSequence() {
  const log = $('#boot-log');
  const bar = $('.boot-bar i');
  for (let i = 0; i < bootLines.length; i++) {
    const [txt, cls] = bootLines[i];
    const l = document.createElement('div');
    l.innerHTML = `<span class="${cls}">[${cls === 'warn' ? '!' : 'OK'}]</span> ${txt}`;
    log.appendChild(l);
    bar.style.width = ((i + 1) / bootLines.length * 100) + '%';
    await new Promise(r => setTimeout(r, 180));
  }
  $('#boot-enter').style.display = 'inline-flex';
}

function enterDesktop() {
  const boot = $('#boot');
  if (boot.classList.contains('done')) return;
  boot.classList.add('done');
  applyTheme();
  setTimeout(() => openApp('about'), 250);
}

$('#boot-enter').addEventListener('click', enterDesktop);
$('#boot').addEventListener('click', e => {
  if (e.target.closest('#boot-enter')) return;
  if ($('#boot-enter').style.display !== 'none') enterDesktop();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && $('#boot-enter').style.display !== 'none') enterDesktop();
});

/* ============ INIT ============ */
applyTheme();
buildPaletteItems();
renderPaletteList();
bootSequence();
</script>
